async function seed(){const n=["Kimchi","Seoul","Hangul"];await E(sb.from("teams").insert(n.map((x,i)=>({name:x,color:COL[i],code:x.slice(0,3).toUpperCase()+(100+i*37)}))));
 const Q=[["Tarjima","“Men koreys tilini o‘rganaman” — koreyscha tarjima qiling.","저는 한국어를 공부해요.","translation",10,180,"저는 한국어를 공부해요"],["Xatoni toping","Gapdagi grammatik xatoni toping va to‘g‘rilang:","저는 학교에 공부를 해요.","mistake",10,180,"학교에서 공부를 해요"],["Gap tuzing","Berilgan so‘zlardan gap tuzing: 친구, 도서관, 책, 읽다","친구, 도서관, 책, 읽다","build",10,240,"친구가 도서관에서 책을 읽어요"],["Ko‘p tanlov","‘사과’ nimani anglatadi? A) olma B) nok C) uzum","사과","mc",5,60,"A"],["Lug‘at","‘Oziq-ovqat’ mavzusida kamida 5 ta koreys so‘zini yozing.","음식","vocab",10,120,"김치, 밥, 물, 빵, 고기"]];
 for(let i=0;i<5;i++){const q=Q[i],r=await E(sb.from("questions").insert({title:q[0],descr:q[1],ko:q[2],qtype:q[3],pts:q[4],secs:q[5],ord:Date.now()+i}).select().single());if(r&&r.id)await E(sb.from("question_keys").insert({qid:r.id,answer:q[6]}))}await load()}
function aTeams(){const c=S.comp,lock=c.status!="upcoming"?"disabled":"";return `<div class="card"><h3>Yangi jamoa</h3><div class="row"><input id="tn" placeholder="Jamoa nomi" style="flex:1"><button class="btn" onclick="addTeam()">Yaratish</button></div><div class="row" style="margin-top:8px"><button class="btn r" onclick="delAllTeams()">Barcha jamoalarni o‘chirish</button></div><div class="row" style="margin-top:8px"><span class="mu">Maks. a’zolar:</span><input id="mx" type="number" min="1" max="20" value="${c.max_size}" style="width:80px" ${lock}><button class="btn s" onclick="setMax()" ${lock}>Saqlash</button></div></div>
 <div class="grid">${S.teams.map(t=>{const ms=S.members.filter(m=>m.team_id==t.id),full=ms.length>=c.max_size,sc=total(t).p;return `<div class="card"><h3><span class="dot" style="background:${t.color}"></span> ${esc(t.name)} <span class="pill ${full?"warn":""}">${full?"To‘lgan":"Yig‘ilmoqda"}</span></h3><p class="mu">Kod: <b>${esc(t.code)}</b> · ${ms.length}/${c.max_size} · ${sc} ball</p>${ms.map(m=>`<div class="row"><span class="sp">${esc(m.name)}${t.cap==m.id?" ⭐":""}</span>${t.cap!=m.id?`<button class="btn s" onclick="cap('${t.id}','${m.id}')">Kapitan</button>`:""}<button class="btn s" onclick="mv('${m.id}')">Ko‘chirish</button><button class="btn r" onclick="rm('${t.id}','${m.id}')">×</button></div>`).join("")||'<span class="mu">A’zolar yo‘q</span>'}<div class="row" style="margin-top:8px"><button class="btn r" onclick="delTeam('${t.id}')">Guruhni o‘chirish</button></div></div>`}).join("")}</div>`}
async function addTeam(){const n=$("#tn").value.trim();if(!n)return;$("#tn").value="";const code=(n.replace(/[^A-Za-z]/g,"").slice(0,3).toUpperCase()||"TEA").padEnd(3,"X")+(100+Math.floor(Math.random()*899));await E(sb.from("teams").insert({name:n,color:COL[S.teams.length%5],code}));await load()}
async function setMax(){const v=+$("#mx").value;if(!(v>=1)||S.teams.some(t=>S.members.filter(m=>m.team_id==t.id).length>v))return alert("Noto‘g‘ri qiymat");await up({max_size:v})}
async function cap(t,m){await E(sb.from("teams").update({cap:m}).eq("id",t));await load()}
async function rm(t,m){if(!confirm("Chiqarilsinmi?"))return;await E(sb.from("members").delete().eq("id",m));await E(sb.from("teams").update({cap:null}).eq("id",t).eq("cap",m));await load()}
async function mv(m){const to=prompt("Qaysi jamoaga? "+S.teams.map(x=>x.name).join(", ")),d=S.teams.find(x=>x.name.toLowerCase()==(to||"").toLowerCase()),mm=S.members.find(x=>x.id==m);if(!d||d.id==mm.team_id)return;if(S.members.filter(x=>x.team_id==d.id).length>=S.comp.max_size)return alert("Jamoa to‘lgan");await E(sb.from("teams").update({cap:null}).eq("id",mm.team_id).eq("cap",m));await E(sb.from("members").update({team_id:d.id}).eq("id",m));await load()}
async function delTeam(id){const t=S.teams.find(x=>x.id==id);if(!t||!confirm("“"+t.name+"” guruhi, uning a’zolari, javoblari, ballari va xabarlari butunlay o‘chiriladi. Davom etasizmi?"))return;await E(sb.from("teams").delete().eq("id",id));await load()}
async function delAllTeams(){if(!S.teams.length)return alert("Jamoalar yo‘q");if(!confirm("BARCHA "+S.teams.length+" ta jamoa va ularning ma’lumotlari o‘chiriladi. Davom etasizmi?")||!confirm("Aniq o‘chiraymi? Buni qaytarib bo‘lmaydi."))return;await E(sb.from("teams").delete().neq("id","00000000-0000-0000-0000-000000000000"));await load()}
function aQs(){return `<div class="card"><h3>Yangi savol</h3><div class="grid"><input id="qt" placeholder="Sarlavha"><input id="qk" placeholder="Koreyscha matn"><input id="qd" placeholder="Tavsif"><input id="qa" placeholder="To‘g‘ri javob (faqat admin)"><select id="qy"><option value="open">Ochiq javob</option><option value="mc">Ko‘p tanlov</option><option value="translation">Tarjima</option><option value="build">Gap tuzish</option><option value="mistake">Xatoni toping</option><option value="vocab">Lug‘at</option></select><input id="qp" type="number" value="10" placeholder="Maks. ball"><input id="qs" type="number" value="180" placeholder="Soniya"></div><button class="btn" onclick="addQ()" style="margin-top:8px">Saqlash</button></div>`+
 S.qs.map(q=>`<div class="card"><div class="row"><b class="sp">${esc(q.title)} <span class="pill ${q.status=="published"?"live":""}">${{draft:"Qoralama",published:"E’lon qilingan",closed:"Yopilgan"}[q.status]}</span></b><span class="mu">${q.pts} ball · ${q.secs} s</span></div>${q.ko?`<div class="ko">${esc(q.ko)}</div>`:""}<p class="mu">To‘g‘ri javob (admin): ${esc(S.keys[q.id])}</p><div class="row">${q.status=="draft"?`<button class="btn g" onclick="qa('${q.id}','publish')">E’lon qilish</button>`:""}${q.status=="published"?`${timerBox(q)}<button class="btn s" onclick="qa('${q.id}','extend')">+30 s</button><button class="btn r" onclick="qa('${q.id}','close')">Yopish</button>`:""}${q.status=="closed"?`<button class="btn s" onclick="revQ('${q.id}',${!q.revealed})">${q.revealed?"Javobni yashirish":"Javobni ochish"}</button><button class="btn s" onclick="qa('${q.id}','publish')">Qayta e’lon qilish</button>`:""}${q.status!="published"?`<button class="btn s" onclick="delQ('${q.id}')">O‘chirish</button>`:""}</div></div>`).join("")}
async function addQ(){const t=$("#qt").value.trim(),p=+$("#qp").value,s=+$("#qs").value;if(!t)return alert("Sarlavha kerak");if(!(p>0&&s>=10))return alert("Ball va vaqtni tekshiring");const a=$("#qa").value,row={title:t,descr:$("#qd").value,ko:$("#qk").value,qtype:$("#qy").value,pts:p,secs:s,ord:Date.now()};["qt","qk","qd","qa"].forEach(i=>$("#"+i).value="");
 const r=await E(sb.from("questions").insert(row).select().single());if(r&&r.id)await E(sb.from("question_keys").insert({qid:r.id,answer:a}));await load()}
async function qa(id,act){const r=await E(sb.rpc("q_action",{p_qid:id,act}));if(r&&r!="ok"&&r!==true)alert(r);await load()}
async function revQ(id,v){await E(sb.from("questions").update({revealed:v}).eq("id",id));await load()}
async function delQ(id){if(confirm("O‘chirilsinmi?")){await E(sb.from("questions").delete().eq("id",id));await load()}}
function aScore(){const qs=S.qs.filter(q=>q.status!="draft");if(!qs.length)return `<div class="card mu">Hali e’lon qilingan savol yo‘q.</div>`;
 return qs.map(q=>`<div class="card"><h3>${esc(q.title)} <span class="mu">(maks. ${q.pts})</span></h3>${S.teams.map(t=>{const k=q.id+"_"+t.id,s=S.subs.find(x=>x.qid==q.id&&x.team_id==t.id),g=S.scores.find(x=>x.qid==q.id&&x.team_id==t.id);if(!s)return `<div class="row mu"><span class="dot" style="background:${t.color}"></span> ${esc(t.name)}: yuborilmagan</div>`;
 return `<div class="card" style="background:var(--bg)"><b>${esc(t.name)}</b> <span class="pill ${g?"live":"warn"}">${g?(g.published?"E’lon qilingan":"Baholangan"):"Kutilmoqda"}</span> <span class="pill">O‘z vaqtida (server)</span><p>${esc(s.body)}</p><p class="mu">Vaqt: ${new Date(s.at).toLocaleTimeString("uz")} · ${esc(s.by_name)}</p><div class="row"><input id="p_${k}" type="number" min="0" max="${q.pts}" value="${g?g.score:""}" placeholder="Ball" style="width:90px"><input id="f_${k}" value="${esc(g?g.fb:"")}" placeholder="Izoh" style="flex:1"><button class="btn" onclick="sc('${q.id}','${t.id}')">${g?"Tahrirlash":"Ball berish"}</button></div>${S.hist.filter(h=>h.qid==q.id&&h.team_id==t.id).sort((a,b)=>a.at<b.at?-1:1).map(h=>`<div class="mu">Tarix: ${h.old_score} → ${h.new_score} (${new Date(h.at).toLocaleTimeString("uz")})</div>`).join("")}</div>`}).join("")}</div>`).join("")}
async function sc(qid,tid){const q=S.qs.find(x=>x.id==qid),k=qid+"_"+tid,g=S.scores.find(x=>x.qid==qid&&x.team_id==tid),v=$("#p_"+k).value,fb=$("#f_"+k).value.slice(0,300);if(v===""||isNaN(+v)||+v<0||+v>q.pts)return alert("Ball 0 va "+q.pts+" oralig‘ida bo‘lishi kerak");
 if(g){if(+v==+g.score&&fb==g.fb)return;if(!confirm("Bahoni "+g.score+" dan "+v+" ga o‘zgartirasizmi?"))return;if(+v!=+g.score)await E(sb.from("score_history").insert({qid,team_id:tid,old_score:g.score,new_score:+v}))}
 await E(sb.from("scores").upsert({qid,team_id:tid,score:+v,fb,published:g?g.published:!S.comp.hidden},{onConflict:"qid,team_id"}));await load()}
boot();
</script></body></html>
